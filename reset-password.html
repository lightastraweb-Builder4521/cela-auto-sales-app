<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Choose a New Password | Cela Inventory Manager</title>
  <!-- Private employee system: never index -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>(function(){var t='dark';try{var p=JSON.parse(localStorage.getItem('cela.prefs')||'{}');t=p.theme||'dark';}catch(e){}if(t==='system'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');})();</script>
  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="js/pages/reset-password.js"></script>
</head>
<body class="auth-body">
  <main class="auth" id="main">
    <section class="auth__card" aria-labelledby="reset-title">
      <img class="auth__logo" src="images/cela-logo.png" width="632" height="313" alt="Cela Auto Sales LLC">
      <p class="auth__eyebrow">Employees only</p>
      <h1 id="reset-title">Choose a new password</h1>

      <form class="form auth__form" data-reset-form novalidate hidden>
        <p class="auth__hint">Use at least <span data-min-length>10</span> characters. A long phrase is easiest to remember.</p>
        <div class="field">
          <label class="field__label" for="reset-password">New password</label>
          <input class="input" type="password" id="reset-password" name="new-password" autocomplete="new-password">
        </div>
        <div class="field">
          <label class="field__label" for="reset-confirm">Confirm new password</label>
          <input class="input" type="password" id="reset-confirm" name="confirm-password" autocomplete="new-password">
        </div>
        <p class="form-alert" data-reset-error role="alert" hidden></p>
        <button type="submit" class="btn btn--primary btn--lg btn--block" data-reset-submit>Save New Password</button>
      </form>

      <div data-reset-invalid hidden>
        <p class="form-alert" role="alert" data-reset-invalid-text>This page needs the link from your password-reset email.</p>
        <p class="auth__aside"><a class="auth__link" href="login.html?forgot=1">Request a new reset link</a></p>
      </div>

      <p class="auth__aside"><a class="auth__link" href="login.html">Back to sign in</a></p>
    </section>
    <p class="auth__foot">Cela Auto Sales LLC · Private employee system</p>
  </main>
  <noscript><p class="noscript">The Cela Inventory Manager needs JavaScript. Please enable it and reload.</p></noscript>
</body>
</html>
